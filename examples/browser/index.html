<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clippy for Modern Browsers</title>
    <link rel="stylesheet" href="../../src/style.css" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        background: #f4f4f0;
        color: #202020;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        max-width: 1180px;
        padding: 32px;
        gap: 18px;
      }

      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        max-width: 1040px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      .github-link {
        color: #0847a6;
        font-weight: 600;
        text-decoration: none;
      }

      .github-link:hover {
        text-decoration: underline;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
        max-width: 1040px;
      }

      .control-group {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        align-items: stretch;
      }

      .control-group-wide {
        grid-template-columns: minmax(0, 1fr);
      }

      label {
        display: grid;
        gap: 5px;
        font-size: 13px;
        font-weight: 600;
      }

      select,
      input,
      button {
        min-height: 36px;
        border: 1px solid #9b9b8f;
        border-radius: 6px;
        background: #fff;
        color: #202020;
        font: inherit;
      }

      select,
      input {
        padding: 0 10px;
      }

      button {
        padding: 0 12px;
        cursor: pointer;
      }

      .command-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: end;
      }

      .agent-list {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        max-width: 1040px;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .agent-chip {
        flex: 0 0 auto;
        padding: 5px 8px;
        border: 1px solid #c6c6bb;
        border-radius: 999px;
        background: #fff;
        font-size: 12px;
      }

      @media (max-width: 760px) {
        main {
          padding: 20px;
        }

        .page-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .command-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>Clippy for Modern Browsers</h1>
        <a class="github-link" href="https://github.com/gmarconi/clippy">GitHub</a>
      </header>
      <label>
        Target
        <select id="target"></select>
      </label>
      <div id="agent-list" class="agent-list" aria-label="Loaded agents"></div>
      <div class="toolbar">
        <div class="control-group">
          <div class="command-row">
            <label>
              Animation
              <select id="animation"></select>
            </label>
            <button id="animate" type="button">Animate</button>
          </div>
        </div>
        <div class="control-group">
          <div class="command-row">
            <label>
              Intent
              <select id="intent"></select>
            </label>
            <button id="perform" type="button">Perform</button>
          </div>
        </div>
        <div class="control-group control-group-wide">
          <label>
            Message
            <input id="message" value="Hello World!" />
          </label>
          <div class="command-row">
            <label>
              Balloon
              <select id="balloon-position"></select>
            </label>
            <button id="speak" type="button">Speak</button>
          </div>
        </div>
        <button id="stop" type="button">Stop</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
