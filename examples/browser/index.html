<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Clippy</title>
    <link rel="stylesheet" href="../../src/style.css" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        background: #f4f4f0;
        color: #202020;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        max-width: 1180px;
        padding: 32px;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: repeat(4, minmax(180px, 1fr));
        gap: 12px;
        align-items: stretch;
        max-width: 1040px;
      }

      .control-group {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: end;
      }

      .control-group-wide {
        grid-column: span 2;
        grid-template-columns: minmax(180px, 1fr) minmax(120px, 180px) auto;
      }

      label {
        display: grid;
        gap: 5px;
        font-size: 13px;
        font-weight: 600;
      }

      select,
      input,
      button {
        min-height: 36px;
        border: 1px solid #9b9b8f;
        border-radius: 6px;
        background: #fff;
        color: #202020;
        font: inherit;
      }

      select,
      input {
        padding: 0 10px;
      }

      button {
        padding: 0 12px;
        cursor: pointer;
      }

      .agent-list {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        max-width: 1040px;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .agent-chip {
        flex: 0 0 auto;
        padding: 5px 8px;
        border: 1px solid #c6c6bb;
        border-radius: 999px;
        background: #fff;
        font-size: 12px;
      }

      @media (max-width: 760px) {
        .toolbar {
          grid-template-columns: 1fr;
        }

        .control-group,
        .control-group-wide {
          grid-column: auto;
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Modern Clippy</h1>
      <label>
        Target
        <select id="target"></select>
      </label>
      <div id="agent-list" class="agent-list" aria-label="Loaded agents"></div>
      <div class="toolbar">
        <div class="control-group">
          <label>
            Animation
            <select id="animation"></select>
          </label>
          <button id="animate" type="button">Animate</button>
        </div>
        <div class="control-group">
          <label>
            Intent
            <select id="intent"></select>
          </label>
          <button id="perform" type="button">Perform</button>
        </div>
        <div class="control-group control-group-wide">
          <label>
            Message
            <input id="message" value="Hello World!" />
          </label>
          <label>
            Balloon
            <select id="balloon-position"></select>
          </label>
          <button id="speak" type="button">Speak</button>
        </div>
        <button id="stop" type="button">Stop</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
