<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Clippy</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        background: #f4f4f0;
        color: #202020;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        max-width: 980px;
        padding: 32px;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: repeat(4, minmax(140px, 1fr));
        gap: 12px;
        align-items: end;
        max-width: 900px;
      }

      label {
        display: grid;
        gap: 5px;
        font-size: 13px;
        font-weight: 600;
      }

      select,
      input,
      button {
        min-height: 36px;
        border: 1px solid #9b9b8f;
        border-radius: 6px;
        background: #fff;
        color: #202020;
        font: inherit;
      }

      select,
      input {
        padding: 0 10px;
      }

      button {
        padding: 0 12px;
        cursor: pointer;
      }

      .agent-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-width: 900px;
      }

      .status {
        max-width: 900px;
        font-size: 13px;
        color: #4d4d46;
      }

      .agent-chip {
        padding: 5px 8px;
        border: 1px solid #c6c6bb;
        border-radius: 999px;
        background: #fff;
        font-size: 12px;
      }

      @media (max-width: 760px) {
        .toolbar {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Modern Clippy</h1>
      <div class="toolbar">
        <label>
          Target
          <select id="target"></select>
        </label>
        <label>
          Animation
          <select id="animation"></select>
        </label>
        <label>
          Message
          <input id="message" value="Everything here is loaded locally." />
        </label>
        <label>
          Clippy 10 Override
          <select id="sound-override"></select>
        </label>
        <button id="speak" type="button">Speak</button>
        <button id="animate" type="button">Animate</button>
        <button id="random" type="button">Random</button>
        <button id="scatter" type="button">Scatter</button>
        <button id="stop" type="button">Stop</button>
        <button id="reload" type="button">Reload Agents</button>
        <label>
          Test Sound
          <select id="sound-test"></select>
        </label>
        <button id="play-sound" type="button">Play Sound</button>
      </div>
      <div id="status" class="status"></div>
      <div id="agent-list" class="agent-list" aria-label="Loaded agents"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
